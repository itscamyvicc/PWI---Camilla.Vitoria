<!DOCTYPE html>
<html lang="pt-BR">
<head>
<style>
#MyHeader {
    background-image: linear-gradient(#7F27FF, #9F70FD);
    border-radius: 25px;
    color: #ffffff;
    padding: 70px;
    text-align: center;
    font-size: 270%;
}

.nav {
    background-color: #9F70FD;
    border-radius: 25px;
    list-style-type: none;
    text-align: center;
    margin: 0px;
    padding: 0px;
}

.nav li {
    display: inline-block;
    padding: 30px;
}

a:link, a:visited {
    background-color: #7F27FF;
    color: white;
    padding: 10px 20px;
    text-decoration: none;
    display: inline-block;
    border-radius: 30px;
}

a:hover, a:active {
    background-color: #0073ff;
}

</style>
</head>
<body>
<h1 id="MyHeader"> Bem vindo ao PetFriends™! </h1>

<ul class="nav">
    <li><a href="/Início/"> Início </a></li>
    <li><a href="/Produtos/"> Produtos </a></li>
    <li><a href="/Contatos/"> Contatos </a></li>
    <li><a href="/Serviços/"> Serviços </a></li>
    <li><a href="/Agendar/"> Agendar </a></li>
</ul>

</body>
</html>
